const SUBJ_COLOR = {
 '數學':'#4e79ff','國語文':'#ff6b6b','英語文':'#ffa94d','自然科學':'#38d39f',
 '社會':'#c48cff','生活課程':'#ffd43b','綜合活動':'#f783ac','健康與體育':'#4dd2ff',
 '藝術':'#ff8fab',
 '本土語文（閩南語文）':'#7d8aa0','本土語文（客語文）':'#7d8aa0','本土語文（原住民族語文）':'#7d8aa0',
 '本土語文（閩東語文）':'#7d8aa0','新住民語文':'#7d8aa0','臺灣手語':'#7d8aa0'};
const subjColor = s => SUBJ_COLOR[s] || '#7d8aa0';

const stageEl = document.getElementById('stage');
let W = stageEl.clientWidth, H = stageEl.clientHeight;
const svg = d3.select('#stage').append('svg').attr('width',W).attr('height',H);
const g = svg.append('g');
const gBands = g.append('g').attr('class','bands');
const gLink = g.append('g');
const gNode = g.append('g');

// 年段分層 y
const bandY = st => H*0.16 + (st-1)*(H*0.30);
[[1,'一・二年級'],[2,'三・四年級'],[5,'五・六年級']].forEach((b,i)=>{
 const st=i+1, y=bandY(st);
 gBands.append('line').attr('x1',40).attr('x2',W-20).attr('y1',y).attr('y2',y);
 gBands.append('text').attr('x',46).attr('y',y-8).text(b[1]);
});

const nodes = DATA.nodes.map(d=>({...d}));
const id2 = new Map(nodes.map(n=>[n.id,n]));
const links = DATA.links.map(l=>({source:l.s,target:l.t,h:l.h}));
// 上游鄰接（target -> [source...]）用於追先修
const upstream = new Map(nodes.map(n=>[n.id,[]]));
links.forEach(l=>upstream.get(l.t).push(l.s));

// 學科 x 群集（環形分佈）
const subjects=[...new Set(nodes.map(n=>n.s))];
const sx=new Map(); subjects.forEach((s,i)=>{
 sx.set(s, W*0.20 + (W*0.62)*(i/(subjects.length-1)));
});

const link = gLink.selectAll('line').data(links).join('line')
 .attr('stroke','#33465e').attr('stroke-width',d=>d.h?1.1:.6).attr('stroke-opacity',.35);
const node = gNode.selectAll('circle').data(nodes).join('circle')
 .attr('r',d=>3.2 + d.c*13).attr('fill',d=>subjColor(d.s))
 .attr('stroke','#0b0f16').attr('stroke-width',d=>d.p?0:.6)
 .attr('opacity',d=>d.p?.72:1)
 .on('mouseover',(e,d)=>{const t=d3.select('#tip');
   t.style('display','block').html(`<b>${d.n}</b><br>${d.s} · ${d.g}年級 · 中心性${d.c}`);})
 .on('mousemove',e=>{d3.select('#tip').style('left',(e.offsetX+14)+'px').style('top',(e.offsetY+12)+'px');})
 .on('mouseout',()=>d3.select('#tip').style('display','none'))
 .on('click',(e,d)=>{highlight(d); showDetail(d); e.stopPropagation();});
node.append('title').text(d=>d.n);

const sim = d3.forceSimulation(nodes)
 .force('link', d3.forceLink(links).id(d=>d.id).distance(34).strength(d=>d.h?.5:.18))
 .force('charge', d3.forceManyBody().strength(-42))
 .force('x', d3.forceX(d=>sx.get(d.s)).strength(.09))
 .force('y', d3.forceY(d=>bandY(d.st)).strength(.5))
 .force('collide', d3.forceCollide().radius(d=>4.5 + d.c*13))
 .velocityDecay(.32);
sim.on('tick',()=>{
 link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
 node.attr('cx',d=>d.x).attr('cy',d=>d.y);
});
for(let i=0;i<220;i++) sim.tick(); sim.alpha(.3).restart();

node.call(d3.drag()
 .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;})
 .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
 .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

svg.call(d3.zoom().scaleExtent([.3,5]).on('zoom',e=>g.attr('transform',e.transform)));
svg.on('click',()=>{clearHi();hideDetail();});

// 高亮先修鏈（BFS 上游）
function ancestors(d){const seen=new Set(),st=[d.id];while(st.length){const u=st.pop();
 for(const p of upstream.get(u)) if(!seen.has(p)){seen.add(p);st.push(p);}} return seen;}
function highlight(d){
 const anc=ancestors(d); anc.add(d.id);
 node.attr('opacity',n=>anc.has(n.id)?1:.08);
 link.attr('stroke',l=>(anc.has(l.source.id)&&anc.has(l.target.id))?'#ffd43b':'#33465e')
     .attr('stroke-opacity',l=>(anc.has(l.source.id)&&anc.has(l.target.id))?.9:.04)
     .attr('stroke-width',l=>(anc.has(l.source.id)&&anc.has(l.target.id))?1.6:.5);
}
function clearHi(){node.attr('opacity',n=>n.p?.72:1);
 link.attr('stroke','#33465e').attr('stroke-opacity',.35).attr('stroke-width',d=>d.h?1.1:.6);}
document.getElementById('reset').onclick=()=>{clearHi();hideDetail();};

function showDetail(d){
 const anc=ancestors(d);
 const direct=upstream.get(d.id).map(i=>id2.get(i).n);
 const el=document.getElementById('detail'); el.style.display='block';
 el.innerHTML=`<div class="nm">${d.n}</div>
  <div class="meta">${d.s} · ${d.g}年級 · 中心性 ${d.c}${d.p?' · 表現能力節點':''}</div>
  <div>直接先修（${direct.length}）：</div>
  <ul>${direct.slice(0,12).map(x=>`<li>${x}</li>`).join('')||'<li>（起點，無先修）</li>'}</ul>
  <div style="margin-top:6px;color:var(--mut)">往上游共 ${anc.size} 個先修概念</div>`;
}
function hideDetail(){document.getElementById('detail').style.display='none';}

// 圖例（可篩選）
const counts={}; nodes.forEach(n=>counts[n.s]=(counts[n.s]||0)+1);
const legendOrder=['數學','國語文','自然科學','健康與體育','英語文','社會','生活課程','藝術','綜合活動'];
const electN=Object.keys(counts).filter(s=>!legendOrder.includes(s));
const hidden=new Set();
const leg=d3.select('#legend');
function legRow(label,color,cnt,key){
 const row=leg.append('div').on('click',()=>{
   if(hidden.has(key))hidden.delete(key);else hidden.add(key);
   row.classed('off',hidden.has(key)); applyFilter();});
 row.append('span').attr('class','sw').style('background',color);
 row.append('span').text(label);
 row.append('span').attr('class','cnt').text(cnt);
}
legendOrder.forEach(s=>{if(counts[s])legRow(s,subjColor(s),counts[s],s);});
const electCnt=electN.reduce((a,s)=>a+counts[s],0);
if(electCnt)legRow('選修語文（6 種）','#7d8aa0',electCnt,'__elect__');
function applyFilter(){
 const off=n=> hidden.has(n.s) || (hidden.has('__elect__')&&electN.includes(n.s));
 node.style('display',n=>off(n)?'none':null);
 link.style('display',l=>(off(l.source)||off(l.target))?'none':null);
}
window.addEventListener('resize',()=>{W=stageEl.clientWidth;H=stageEl.clientHeight;
 svg.attr('width',W).attr('height',H);});
</script>
